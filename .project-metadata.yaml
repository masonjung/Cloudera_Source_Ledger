# Cloudera AI (AMP) launch descriptor — one click from a catalog entry to a running
# dashboard.
#
# METADATA.yaml is the catalog card; this file is what the platform executes. Every
# task below runs the same code a laptop runs, in the order the README's Quickstart
# runs it: install, preflight, then serve.
#
# Scope, stated once here rather than implied by omission: this AMP installs and
# starts the two layers that are complete today — retrieval (AI) and the dashboard
# (Serve), storing to SQLite on project storage. The Ingest, Lakehouse and Process
# layers are written against the same schema but have never been executed, so no task
# here runs them; they are deployed separately through .cicd/deploy.sh. See the
# layer/state table in README.md.

name: Source Ledger — Text to a Governed Table of URLs
description: |
  Turn a natural-language question into a persisted, reviewable table of source URLs.
  One call reaches four corpora — the open web through four search engines, Wikipedia,
  OpenAlex and arXiv — and every URL is stored with the query, provider, engines,
  region and time window that produced it, so a search becomes an artifact instead of
  an activity. Options a corpus does not support are recorded as NULL rather than as
  the value the form happened to carry, so the record never claims a filter that never
  ran. A FastAPI dashboard, a CLI and a Run All notebook all write through the same
  recorder, and the store is a governable table like any other.
  No API keys, no accounts, no model, no GPU: the only requirement is outbound access
  to the public search endpoints, which the preflight task measures before you present.

author: Cloudera Inc.
specification_version: 1.0
prototype_version: 1.0
date: "2026-09-15"

# One image for the install session, the jobs and the application: pip installs land in
# ~/.local on project storage and are only complete for the image they were installed
# from. Python 3.11 is the version CI runs (.github/workflows/ci.yml).
#
# No `version:` on purpose — an unpinned entry resolves to the newest matching runtime
# in the target workbench, while a pinned one that workbench does not have fails the
# launch before the first task. Pin it if you need the image reproducible.
runtimes:
  - editor: JupyterLab
    kernel: Python 3.11
    edition: Standard

# Nothing here is a credential, and none of it is required: every value has a working
# default and the accelerator runs with all six left alone. They exist so a proxied or
# slow network can be accommodated without a code change.
environment_variables:
  SOURCE_LEDGER_CONTACT:
    default: ""
    description: "Optional contact address advertised to the API providers. Wikipedia asks for a descriptive User-Agent and OpenAlex for a mailto, and both grant better rate limits to callers who identify themselves. Neither is a key and neither is billed. Empty means the anonymous rate-limit pool, which is enough for a demo and thin for a workshop."
  SOURCE_LEDGER_DB:
    default: ""
    description: "Path to the SQLite store. Empty keeps it at data/source_ledger.db on project storage, which is what makes the session, the jobs and the application read and write one record rather than three."
  SOURCE_LEDGER_BACKUP_DIR:
    default: ""
    description: "Where the backup job writes dated snapshots. Empty means backups/ in the project."
  SOURCE_LEDGER_HTTP_TIMEOUT:
    default: "12"
    description: "Per-attempt timeout in seconds for the Wikipedia, OpenAlex and arXiv APIs; three attempts are made. Read once at import, so it must be set before a session, job or the application starts."
  SOURCE_LEDGER_DDGS_TIMEOUT:
    default: "12"
    description: "Timeout in seconds for the web engines. This one number is both the socket timeout and the budget the library spends collecting from the engines it queried concurrently, so engines that miss it are dropped — raise it on a slow or proxied network rather than accepting empty web results."
  DDGS_PROXY:
    default: ""
    description: "Proxy for the web engines, e.g. http://proxy:3128. Set this where a workbench has no direct egress: the web provider reads only its own variable, so a conventional HTTPS_PROXY on the environment is honoured too but this one wins. The API providers are unaffected."

tasks:
  - type: run_session
    name: Install dependencies
    script: .cicd/amp_install.py
    short_summary: Install the runtime dependencies into ~/.local on project storage.
    long_summary: >-
      Installs app/requirements.txt — FastAPI, Uvicorn, Jinja2, python-multipart and the
      ddgs metasearch library — and then confirms each one imports, so a partial install
      fails here rather than at the first search. Everything else the accelerator uses is
      the Python standard library, there is no front-end toolchain to build, and no model
      weights are downloaded. Needs outbound access to PyPI. Takes about a minute.
    kernel: python3
    cpu: 2
    memory: 4

  - type: run_session
    name: Check what this workbench can reach
    script: scripts/doctor.py
    short_summary: Probe every corpus and every web engine individually, with timings.
    long_summary: >-
      Answers before the demo the question a failed demo leaves you with: was that an
      empty result, or a dead network? A datacenter IP is the profile the public web
      engines block hardest, so some or all of the four may return nothing here even
      though they work on a laptop. That is a measurement of this network, not a defect,
      and it does not fail the step — the keyless Wikipedia, OpenAlex and arXiv APIs do
      not block on IP reputation and are what the demo falls back to. Only a total loss
      of connectivity, where no corpus answers at all, stops the launch. Read the verdict
      line: it names which corpora to demo with.
    kernel: python3
    cpu: 1
    memory: 2

  - type: create_job
    name: source-ledger-preflight
    entity_label: source_ledger_preflight
    script: scripts/doctor.py
    arguments: None
    short_summary: The same preflight, as a job you can re-run or schedule before a demo.
    long_summary: >-
      Created, not run — the launch has just run this in a session, and each probe is a
      real outbound search. Run it by hand the morning of a demo, or put it on a schedule
      to find out that an engine started blocking this workbench before a customer does.
    kernel: python3
    cpu: 1
    memory: 2
    timeout: 15

  - type: create_job
    name: source-ledger-backup
    entity_label: source_ledger_backup
    script: data/backup.py
    arguments: --dir backups
    short_summary: Snapshot the SQLite store to a dated file under backups/.
    long_summary: >-
      Created, not run: a snapshot of a store with no searches in it proves nothing. The
      record lives in one SQLite file on project storage, so schedule this once the
      searches in it are worth keeping. It is safe to run while the application is
      serving — the copy goes through SQLite's own backup API rather than the filesystem —
      and it refuses to overwrite an existing snapshot.
    kernel: python3
    cpu: 1
    memory: 2
    timeout: 15

  - type: start_application
    name: Source Ledger
    subdomain: source-ledger
    script: app/server.py
    short_summary: Start the dashboard — search, the stored record, and the CSV export.
    long_summary: >-
      Serves the FastAPI + Jinja2 dashboard on CDSW_APP_PORT; app/hosting.py binds every
      interface here, where the browser is outside the container, and loopback on a
      laptop. Everything is rendered server-side, so there is no build step and every page
      works with JavaScript disabled. GET /healthz reports which process is answering and
      when it loaded its code.
      One thing to weigh before sharing the URL: this application has no authentication
      and no CSRF protection — /clear, /delete/{id}, /dedupe and /store act on an
      unauthenticated POST — so anyone who can reach the subdomain can delete the record.
      Query text also leaves the environment to third-party public endpoints with no API
      key and therefore no data-processing agreement. See governance/DATA_CLASSIFICATION.md.
    kernel: python3
    cpu: 1
    memory: 2
