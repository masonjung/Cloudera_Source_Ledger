# URLvestigia — CI on GitHub.
#
# This repo carries two pipeline definitions on purpose, and they are not
# duplicates of each other:
#
#   .cicd/pipeline.yml   the Forge-standard build → test → deploy pipeline, in
#                        GitLab CI syntax. It is the artifact a Cloudera catalog
#                        submission is reviewed against, and it owns the deploy
#                        stages, which need CDP credentials and a provisioned
#                        environment.
#   this file            what actually runs on every push, because the repo is
#                        hosted on GitHub. Test tiers only — it never deploys.
#
# Keep the two in step: a check added below usually belongs in the GitLab
# `test` or `verify-jobs` stage as well.

name: CI

on:
  push:
  pull_request:

jobs:
  # Mirrors the GitLab `build` + `test` stages. The import check is first
  # because a broken sys.path surfaces here as one readable line, rather than
  # as a wall of fixture errors in the test stage.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            tests/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt -r tests/requirements.txt

      - name: Every layer imports the way the runtime imports it
        run: |
          python -c "import sys; sys.path[:0] = ['retrieval', 'data', 'pipelines/jobs']; import urlvestigia, db, record, url_enrichment; print('layers import OK')"
          python -c "import app.server; from app import hosting; print('serve layer imports OK')"

      # No --live. CI must never fail because a search provider is rate-limiting;
      # the live tier is run by hand before a release. See tests/README.md.
      - name: The Harden gate
        run: pytest tests -q

  # Mirrors the GitLab `verify-jobs` stage: the artifacts that only ever execute
  # on a cluster. Each dry-runs, which is the only check available without a CDP
  # environment — but a bad path fails here rather than at 02:30 in a scheduled job.
  verify-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      # Against a throwaway store with one real row, so the plan has something to
      # report. Pointing it at /dev/null would need `|| true`, and a step that
      # swallows every failure verifies nothing.
      - name: Ingest plan (dry run)
        run: |
          export URLVESTIGIA_DB="${RUNNER_TEMP}/ci.db"
          python -c "
          import sys; sys.path.insert(0, 'data')
          import db
          db.init_db()
          db.save_search('ci probe', ['https://example.org/a'], provider='ddgs',
                         region='wt-wt', safesearch='moderate', timelimit='',
                         backend='duckduckgo', max_results=10)
          "
          python data/ingest/load_to_iceberg.py --db "${URLVESTIGIA_DB}"

      - name: Enrichment plan (dry run, prints the MERGE)
        run: python pipelines/jobs/url_enrichment.py

      - name: Ranger policies parse
        run: python -c "import json; json.load(open('governance/sdx/ranger-policies.json')); print('ranger policies parse OK')"

      - name: Shell scripts parse
        run: |
          bash -n infra/cdp/provision.sh      && echo "provision.sh syntax OK"
          bash -n .cicd/deploy.sh             && echo "deploy.sh syntax OK"
          bash -n scripts/new-accelerator.sh  && echo "new-accelerator.sh syntax OK"
